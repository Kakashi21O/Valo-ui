<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VALORANT UI</title>
  <link rel="stylesheet" href="css/background.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/buttons.css">
</head>
<body>
  <main class="lobby-background" aria-hidden="true">
    <div class="geometry"></div>
    <div class="mist"></div>
    <div class="vignette"></div>
  </main>

  <!-- Top Navbar -->
  <header class="top-navbar">
    <div class="nav-left">
      <button class="play-tab" type="button" aria-label="Play">
        <img class="play-logo" src="assets/images/valorant-logo.png" alt="" />
        <span class="play-text">PLAY</span>
      </button>

      <nav class="nav-items" aria-label="Game Modes & Collection">
        <button class="nav-icon" title="Battlepass" type="button"><img src="assets/icons/battlepass.png" alt="Battlepass" /></button>
        <button class="nav-icon" title="Agents" type="button"><img src="assets/icons/agents.png" alt="Agents" /></button>
        <button class="nav-icon" title="Career" type="button"><img src="assets/icons/career.png" alt="Career" /></button>
        <button class="nav-icon active" title="Collection" type="button"><img src="assets/icons/collection.png" alt="Collection" /></button>
        <button class="nav-icon" title="Progression" type="button"><img src="assets/icons/progression.png" alt="Progression" /></button>
        <button class="nav-icon" title="Arsenal" type="button"><img src="assets/icons/arsenal.png" alt="Arsenal" /></button>
        <button class="nav-icon" title="Store" type="button"><img src="assets/icons/store.png" alt="Store" /></button>
      </nav>
    </div>

    <div class="nav-right" aria-label="Player Status & Utilities">
      <button class="utility-icon message-btn" title="Messages" aria-label="Messages" type="button">
        <img src="assets/icons/nav-mail.png" alt="" />
      </button>

      <button class="currency-btn" title="Kingdom Credits: 0" type="button">
        <img src="assets/icons/nav-kc.png" alt="" class="curr-img" />
        <span>2000</span>
      </button>

      <button class="currency-btn" title="Radianite Points: 845" type="button">
        <img src="assets/icons/nav-radianite.png" alt="" class="curr-img" />
        <span>1000</span>
      </button>

      <button class="currency-btn" title="Valorant Points: 8,539" type="button">
        <img src="assets/icons/nav-vp.png" alt="" class="curr-img" />
        <span>3000</span>
      </button>

      <button class="utility-icon settings-btn" title="Settings" aria-label="Settings" type="button">
        <img src="assets/icons/nav-settings.png" alt="" />
      </button>
    </div>
  </header>

  <!-- Game Mode Subnav Bar -->
  <nav class="mode-subnav" aria-label="Game Modes">
    <button class="mode-tab active" type="button">UNRATED</button>
    <button class="mode-tab" type="button">COMPETITIVE</button>
    <button class="mode-tab" type="button">SPIKE RUSH</button>
    <button class="mode-tab" type="button">DEATHMATCH</button>
    <button class="mode-tab" type="button">REPLICATION</button>
    <button class="mode-tab" type="button">ESCALATION</button>
    <button class="mode-tab" type="button">CUSTOM GAME</button>
  </nav>

  <!-- Lobby Center: Dailies & Missions + 5 Party Plates -->
  <section class="lobby-stage">
    <div class="lobby-stats">
      <div class="stat-col"><span class="stat-lbl">DAILIES</span><span class="stat-val">3/4</span></div>
      <div class="stat-badge"><span>4</span></div>
      <div class="stat-col"><span class="stat-lbl">MISSIONS</span><div class="mission-bars"><span></span><span></span></div></div>
    </div>

    <div class="party-plates">
      <div class="plate plate-outer"><div class="plate-inner"><button class="plate-add" type="button">+</button></div></div>
      <div class="plate plate-mid"><div class="plate-inner"><button class="plate-add" type="button">+</button></div></div>
      <div class="plate plate-main">
        <div class="player-top">
          <div class="player-level">332</div>
          <div class="signal-bars"><span></span><span></span><span></span></div>
        </div>
        <div class="player-art-frame"></div>
        <div class="player-status-bar"></div>
        <div class="player-info">
          <span class="player-ready">READY</span>
          <span class="player-name">Player</span>
          <span class="player-title">Green Flag</span>
        </div>
      </div>
      <div class="plate plate-mid"><div class="plate-inner"><button class="plate-add" type="button">+</button></div></div>
      <div class="plate plate-outer"><div class="plate-inner"><button class="plate-add" type="button">+</button></div></div>
    </div>
  </section>

  <!-- Right Side Social Panel -->
  <aside class="right-sidebar" aria-label="Social Sidebar">
    <button class="side-btn" title="Party"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg></button>
    <button class="side-btn alert-btn" title="Alert"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg></button>
    <div class="side-avatar online"><img src="assets/images/valorant-logo-white.png" alt="" /></div>
    <button class="side-btn invite-btn" title="Requests"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm12 1h-8v6h8v-6zm-1 2l-3 1.75L13 16v-.5l3 1.75 3-1.75V16z"/></svg></button>
    <div class="side-divider"><img src="assets/images/valorant-logo-white.png" alt="" /></div>
    <div class="side-avatar offline"><img src="assets/images/valorant-logo-white.png" alt="" /></div>
    <div class="side-avatar offline"><img src="assets/images/valorant-logo-white.png" alt="" /></div>
    <div class="side-avatar offline"><img src="assets/images/valorant-logo-white.png" alt="" /></div>
  </aside>

  <!-- Bottom Lobby Actions -->
  <div class="lobby-actions">
    <div class="connector" aria-hidden="true"></div>

    <button class="action-btn secondary" id="practice" type="button">
      <span>PRACTICE</span>
      <span class="crosshair" aria-hidden="true">✥</span>
    </button>

    <button class="action-btn primary" id="find-match" type="button">
      <span class="button-label">FIND MATCH</span>
      <span class="button-glow" aria-hidden="true"></span>
    </button>

    <button class="action-btn secondary" id="leave-party" type="button">
      <span>LEAVE PARTY</span>
    </button>
  </div>

  <!-- Bottom-Left Party Status -->
  <div class="bottom-left-party" aria-label="Party status">
    <span class="party-label">Party:</span>
    <button class="party-mic-icon" type="button" title="Push to talk / Voice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2a4 4 0 0 0-4 4v7a4 4 0 0 0 8 0V6a4 4 0 0 0-4-4z"/>
        <path d="M19 10v3a7 7 0 0 1-14 0v-3"/>
        <line x1="12" y1="20" x2="12" y2="23"/>
        <circle cx="12" cy="8" r="1.5" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/buttons.js" defer></script>
</body>
</html>
